name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run build
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Start disposable Supabase
        working-directory: .
        run: supabase start
      - name: Test real API and collection persistence
        run: |
          supabase status --workdir .. -o env > /tmp/nomikai-supabase.env
          set -a
          source /tmp/nomikai-supabase.env
          DATABASE_URL="$DB_URL"
          SUPABASE_URL="$API_URL"
          SUPABASE_SECRET_KEY="$SECRET_KEY"
          API=http://localhost:3101
          API_URL=http://localhost:3101
          PORT=3101
          set +a
          node dist/main.js > /tmp/nomikai-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$API/me")" = 401 ]; then break; fi
            sleep 1
          done
          node test/e2e.mjs
          node test/collection.e2e.mjs
          node test/audit.e2e.mjs
      - name: API diagnostics
        if: failure()
        run: cat /tmp/nomikai-api.log 2>/dev/null || true
